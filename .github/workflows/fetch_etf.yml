name: Fetch Daily ETF Data

on:
  schedule:
    - cron: '30 10 * * *' # 10:30 UTC (18:30 Taiwan, 11:30 Belgium winter time)
  workflow_dispatch: # Allows manual triggering directly from GitHub UI

jobs:
  fetch_etf_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl beautifulsoup4 lxml html5lib playwright
          playwright install chromium
          
      - name: Run ETF 00981A fetch script
        continue-on-error: true
        run: python scripts/fetch_etf_00981A.py
        
      - name: Run ETF 00991A fetch script
        continue-on-error: true
        run: python scripts/fetch_etf_00991A.py
        
      - name: Check for new ETF data
        id: check_data
        run: |
          if grep -q "NEW DATA FOUND" data/etf_00981A_log.json 2>/dev/null || grep -q "NEW DATA FOUND" data/etf_00991A_log.json 2>/dev/null; then
            echo "has_new_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_data=false" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Generate ETF Summary Image
        if: steps.check_data.outputs.has_new_data == 'true'
        continue-on-error: true
        run: python scripts/generate_etf_summary.py
        
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        id: auto-commit-action
        if: always()
        with:
          commit_message: "Auto-update ETF Tracker log and image"
          file_pattern: "data/*.json data/*.jpg"

      - name: Send LINE Notification
        if: steps.check_data.outputs.has_new_data == 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_UID: ${{ secrets.LINE_USER_ID }}
        run: |
          IMG_981_FILE=$(ls -t data/etf_00981A_summary_*.jpg | head -1)
          IMG_991_FILE=$(ls -t data/etf_00991A_summary_*.jpg | head -1)
          
          IMG_981_BASE=$(basename "$IMG_981_FILE")
          IMG_991_BASE=$(basename "$IMG_991_FILE")
          
          IMG_981="https://raw.githubusercontent.com/${{ github.repository }}/main/data/$IMG_981_BASE?t=$(date +%s)"
          IMG_991="https://raw.githubusercontent.com/${{ github.repository }}/main/data/$IMG_991_BASE?t=$(date +%s)"
          
          DATE_STR_981=$(echo "$IMG_981_BASE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          DATE_STR_991=$(echo "$IMG_991_BASE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          
          curl -v -X POST https://api.line.me/v2/bot/message/broadcast \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $LINE_TOKEN" \
          -d '{
            "messages": [
              {
                "type": "text",
                "text": "📅 '"$DATE_STR_981"' 主動統一台股增長 (00981A) 操作日報"
              },
              {
                "type": "image",
                "originalContentUrl": "'"$IMG_981"'",
                "previewImageUrl": "'"$IMG_981"'"
              },
              {
                "type": "text",
                "text": "📅 '"$DATE_STR_991"' 主動復華台灣科技優息 (00991A) 操作日報"
              },
              {
                "type": "image",
                "originalContentUrl": "'"$IMG_991"'",
                "previewImageUrl": "'"$IMG_991"'"
              }
            ]
          }'
