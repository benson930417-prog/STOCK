name: Fetch Daily ETF Data

on:
  schedule:
    - cron: '30 10 * * *' # 10:30 UTC (18:30 Taiwan, 11:30 Belgium winter time)
  workflow_dispatch: # Allows manual triggering directly from GitHub UI

jobs:
  fetch_etf_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl beautifulsoup4 lxml html5lib
          
      - name: Run ETF 00981A fetch script
        run: python scripts/fetch_etf_00981A.py
        
      - name: Run ETF 00991A fetch script
        run: python scripts/fetch_etf_00991A.py
        
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update ETF Tracker log"
          file_pattern: "data/*.json"
