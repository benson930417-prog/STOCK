name: Ping Streamlit App

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (twice a day)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering directly from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: curl -sI https://benson.streamlit.app/ > /dev/null || true
