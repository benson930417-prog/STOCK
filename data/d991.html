
    <!DOCTYPE html>
    <html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
            body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: white; }
        </style>
    </head>
    <body class="p-10 w-[900px] bg-white text-gray-900 border border-gray-100 rounded-lg shadow-md">
        
        <!-- Header -->
        <div class="flex flex-row justify-between items-center border-b border-gray-200 pb-5 mb-8">
            <div class="w-1/2">
                <h1 class="text-[32px] font-black text-[#111111] tracking-tight leading-tight mb-2">
                    主動復華台灣科技優息<br>
                    (00991A)
                </h1>
                <p class="text-lg font-bold text-gray-500 tracking-wide">2026-03-25 操作日報</p>
            </div>
            <div class="flex space-x-12 shrink-0">
                <div class="text-right">
                    <p class="text-sm font-bold text-gray-400 mb-1">基金規模 (TWD)</p>
                    <div class="flex items-center justify-end space-x-2">
                        <span class="text-[40px] leading-none font-black whitespace-nowrap">290&nbsp;億</span>
                        <span class="px-2 py-1 rounded font-bold text-sm bg-gray-100 text-gray-800">+5.15%</span>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm font-bold text-gray-400 mb-1">折溢價</p>
                    <div class="flex items-center justify-end">
                        <span class="text-[40px] leading-none font-black whitespace-nowrap text-[#258C18]">-0.00%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4 KPI Boxes -->
        <div class="grid grid-cols-4 gap-4 mb-10">
            <!-- Inc -->
            <div class="bg-[#FFEAEA] rounded-md p-5 border-l-[6px] border-[#EB2F06] relative">
                <p class="text-[#EB2F06] font-bold text-[17px] mb-1">加碼</p>
                <p class="text-4xl font-black text-[#B01700]">3 <span class="text-lg font-medium text-[#EB2F06]/70">檔</span></p>
            </div>
            <!-- Dec -->
            <div class="bg-[#EAFCDE] rounded-md p-5 border-l-[6px] border-[#44BD32] relative">
                <p class="text-[#44BD32] font-bold text-[17px] mb-1">減碼</p>
                <p class="text-4xl font-black text-[#1E7710]">0 <span class="text-lg font-medium text-[#44BD32]/70">檔</span></p>
            </div>
            <!-- New -->
            <div class="bg-[#FFE6F2] rounded-md p-5 border-l-[6px] border-[#E84393] relative">
                <p class="text-[#E84393] font-bold text-[17px] mb-1">新增</p>
                <p class="text-4xl font-black text-[#A0165B]">0 <span class="text-lg font-medium text-[#E84393]/70">檔</span></p>
            </div>
            <!-- Del -->
            <div class="bg-[#F0F0F0] rounded-md p-5 border-l-[6px] border-[#718093] relative">
                <p class="text-[#718093] font-bold text-[17px] mb-1">刪除</p>
                <p class="text-4xl font-black text-[#2F3640]">0 <span class="text-lg font-medium text-[#718093]/70">檔</span></p>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-6 text-gray-800 border-b border-gray-100 pb-2">資金分配變動 <span class="text-sm font-normal text-gray-400 ml-2">(估值, 億 TWD)</span></h2>
        
        <div class="space-y-6">
    
            <div class="flex items-center text-[15px]">
                <!-- Label -->
                <div class="w-32 text-right pr-4 font-bold text-gray-800 whitespace-nowrap truncate">金像電子</div>
                <!-- Track -->
                <div class="flex-1 flex items-center relative h-10 rounded bg-gray-50 overflow-visible">
                    <!-- 0 Line marker -->
                    <div class="absolute left-1/2 top-[-4px] bottom-[-4px] w-[2px] bg-gray-300 z-0"></div>
            
                    <div class="w-1/2 z-10 pr-3 flex items-center justify-end">
                        <span class="text-gray-400 text-sm mr-2 hidden sm:inline whitespace-nowrap">(2.84% &rarr; 3.02%)</span>
                        <span class="text-gray-500 text-sm font-medium mr-2 whitespace-nowrap">(+70,000 張)</span>
                        <span class="font-extrabold text-[17px] text-[#CC2400] whitespace-nowrap">+6453 萬</span>
                    </div>
                    <div class="w-1/2 flex justify-start z-10">
                        <div class="h-8 bg-[#EB2F06] shadow-sm rounded-r-sm" style="width: 100.0%"></div>
                    </div>
                
                </div>
            </div>
            
            <div class="flex items-center text-[15px]">
                <!-- Label -->
                <div class="w-32 text-right pr-4 font-bold text-gray-800 whitespace-nowrap truncate">南亞電路</div>
                <!-- Track -->
                <div class="flex-1 flex items-center relative h-10 rounded bg-gray-50 overflow-visible">
                    <!-- 0 Line marker -->
                    <div class="absolute left-1/2 top-[-4px] bottom-[-4px] w-[2px] bg-gray-300 z-0"></div>
            
                    <div class="w-1/2 z-10 pr-3 flex items-center justify-end">
                        <span class="text-gray-400 text-sm mr-2 hidden sm:inline whitespace-nowrap">(2.50% &rarr; 2.80%)</span>
                        <span class="text-gray-500 text-sm font-medium mr-2 whitespace-nowrap">(+100,000 張)</span>
                        <span class="font-extrabold text-[17px] text-[#CC2400] whitespace-nowrap">+5400 萬</span>
                    </div>
                    <div class="w-1/2 flex justify-start z-10">
                        <div class="h-8 bg-[#EB2F06] shadow-sm rounded-r-sm" style="width: 83.68449231544469%"></div>
                    </div>
                
                </div>
            </div>
            
            <div class="flex items-center text-[15px]">
                <!-- Label -->
                <div class="w-32 text-right pr-4 font-bold text-gray-800 whitespace-nowrap truncate">南亞科技</div>
                <!-- Track -->
                <div class="flex-1 flex items-center relative h-10 rounded bg-gray-50 overflow-visible">
                    <!-- 0 Line marker -->
                    <div class="absolute left-1/2 top-[-4px] bottom-[-4px] w-[2px] bg-gray-300 z-0"></div>
            
                    <div class="w-1/2 z-10 pr-3 flex items-center justify-end">
                        <span class="text-gray-400 text-sm mr-2 hidden sm:inline whitespace-nowrap">(6.52% &rarr; 6.65%)</span>
                        <span class="text-gray-500 text-sm font-medium mr-2 whitespace-nowrap">(+200,000 張)</span>
                        <span class="font-extrabold text-[17px] text-[#CC2400] whitespace-nowrap">+4530 萬</span>
                    </div>
                    <div class="w-1/2 flex justify-start z-10">
                        <div class="h-8 bg-[#EB2F06] shadow-sm rounded-r-sm" style="width: 70.2014138988929%"></div>
                    </div>
                
                </div>
            </div>
            
        </div>
    </body>
    </html>
