<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 69 頁 · 天花剖面核對</title><style>*{box-sizing:border-box}body{background:#202523;color:#edf0e9;font:16px/1.6 system-ui,'Microsoft JhengHei',sans-serif;margin:0}main{max-width:1200px;margin:auto;padding:25px}a{color:#d9e7cb}h1{font-size:25px;font-weight:500}h2{font-size:19px;font-weight:500}p{color:#c4cdc3}img{width:100%;display:block;background:#fff;border-radius:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}figure{margin:0}figcaption{padding:10px 0}table{border-collapse:collapse;width:100%;margin:20px 0}th,td{text-align:left;padding:9px;border-bottom:1px solid #526054}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><a href="review.html">← 回到互動房間</a><h1>以第 69 頁作為天花剖面與高度依據</h1><p>原圖左邊是陽台，右邊是原衣櫃側。以下模型剖面使用相同觀看方向，直接呈現同一份 Blender 模型的輪廓。</p><h2>原施工圖 S3 局部</h2><img src="source-p69-profile.png" alt="第69頁施工剖面，陽台風口水平、中央風口垂直，兩側有藏燈層板"><div class="grid"><figure><h2>陽台側：水平風口</h2><img src="08-balcony-section.png" alt="模型陽台側剖面：左側窗簾凹槽、中間上方水平格柵、右側伸出層板及內藏LED"><figcaption>風口藏在凹槽頂部朝下。右側層板伸出，LED 位於靠內側的板面上，前緣有擋光邊。</figcaption></figure><figure><h2>中央：垂直風口</h2><img src="07-central-section.png" alt="模型中央剖面：垂直側向格柵，下方伸出層板及內藏LED"><figcaption>風口位於高低差立面，朝高天花區側向出風。下方伸出層板，LED 藏在擋光邊後面。</figcaption></figure></div><table><thead><tr><th>依據</th><th>採用內容</th></tr></thead><tbody><tr><td>第 69 頁高度</td><td>250、260 cm；依 20 cm 高差得到 280 cm</td></tr><tr><td>原衣櫃側</td><td>105 cm 低天花範圍保留</td></tr><tr><td>陽台側水平尺寸</td><td>12＋25＋25 cm，按原圖端點定位</td></tr><tr><td>向量比例量得</td><td>伸出層板約 25／10 cm；板面約 H263、擋光邊頂約 H265</td></tr></tbody></table><p>格柵葉片、LED 外形等未標註細節仍為示意。尺寸基準與可重建資料見 <a href="README.md">說明</a>、<a href="ceiling-profile-p69.json">剖面座標</a>。</p></main></body></html>
