<style>

toggles label{display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}input{accent-color:#45614c;width:16px;height:16px}select{font-size:13px;padding:6px 8px;border:1px solid #cbd4c6;background:#fffefa;border-radius:6px;max-width:100%}.fullscreen-views{display:none}#outlet-info{padding:10px 15px;background:#edf0e8;border-top:1px solid #d8ddd1;font-size:13px}#outlet-info p{margin:6px 0 0;color:#56614f}.hint{font-size:12px;color:#78816f;margin:9px 2px 20px}.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid #d9dfd2;padding-top:18px}h2{font-size:14px;font-weight:600;margin:0 0 5px}.brief p{margin:0;font-size:14px;color:#687360}.footnote{font-size:12px;color:#7f8679;margin:20px 0 0}.site-reference{border-top:1px solid #d9dfd2;margin-top:18px;padding-top:14px;font-size:13px;color:#65735f}.site-reference img{display:block;max-height:75vh;max-width:100%;margin:14px auto 0;border-radius:8px}.viewer:fullscreen{border:none;border-radius:0;display:flex;flex-direction:column}.viewer:fullscreen #viewport{flex:1;height:auto;max-height:none;min-height:0}.viewer:fullscreen .viewbar,.viewer:fullscreen .toolbar,.viewer:fullscreen #outlet-info{flex:none}.viewer:fullscreen .fullscreen-views{display:block}.viewer:fullscreen nav{display:none}

<header><div><div class="eyebrow">BEDROOM A / 3F</div><h1>臥室 A・空間提案</h1><p>床頭靠左牆，床尾朝陽台。</p></div><span class="badge">設計討論稿</span></header>
<section class="viewer" id="viewer" aria-label="房間互動模型">
<div class="viewbar"><nav aria-label="預設視角"><button data-view="overview" aria-pressed="false">整體</button><button data-view="top" aria-pressed="false">平面</button><button data-view="bed" aria-pressed="true">看陽台</button><button data-view="balcony" aria-pressed="false">看床區</button><button data-view="outlets" aria-pressed="false">插座位置</button></nav><label class="fullscreen-views"><select id="quickview" aria-label="切換視角"><option value="overview">整體配置</option><option value="top">俯視平面</option><option value="bed">看陽台</option><option value="entry">入口看床</option><option value="balcony">看床區</option><option value="outlets">插座位置</option></select></label><button id="fullscreen">放大</button></div>
<div id="viewport"><img id="fallback" src="03-bed-to-balcony.png" alt="房間朝陽台的配置示意" hidden><div id="loading" role="status">正在載入房間…</div></div>
<div class="toolbar"><p id="status" role="status">床上朝陽台看</p><details><summary>顯示選項</summary><div class="toggles"><label><input type="checkbox" id="ceiling" checked>天花</label><label><input type="checkbox" id="walls" checked>左／前牆</label><label><input type="checkbox" id="furniture" checked>家具</label><label><input type="checkbox" id="led" checked>燈帶</label><label><input type="checkbox" id="edges" checked>邊線</label><label><input type="checkbox" id="outlets">插座標記</label></div></details></div>
<div id="outlet-info" hidden><select id="outlet-select" aria-label="選擇插座位置"><option value="">全部位置</option></select><p id="outlet-detail"></p></div>
</section>
<p class="hint">拖曳轉動視角，滾輪調整遠近。手機可單指轉動；選「整體」後可雙指縮放。</p>
<section class="brief" aria-label="配置重點"><div><h2>床位</h2><p>180 × 200 cm 雙人床，床尾朝陽台；原左側衣櫃取消。</p></div><div><h2>收納與書桌</h2><p>衣櫃、書桌暫放陽台側，位置與造型可再討論。</p></div><div><h2>天花與照明</h2><p>保留高低天花與內藏燈帶，空調風口整合於天花轉折。</p></div></section>
<p class="footnote">本頁為空間配置示意，門窗細節、尺寸與插座安裝高度仍待確認。</p>
<details class="site-reference"><summary>查看現況照片</summary><img src="site-photo.png" loading="lazy" alt="臥室 A 現況，朝陽台方向"></details>
</main><script type="module" src="viewer.js?v=window-frames-3"></script></body></html>
